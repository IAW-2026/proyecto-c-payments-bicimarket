components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk JWT token for UI/authenticated endpoints
    X-Service-Token:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Service token for inter-app communication (Buyer, Seller, Shipping)
    X-Analytics-Token:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Analytics service token (DASHBOARD_TO_PAYMENTS_SERVICE_TOKEN) — no admin fallback

  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              nullable: true
              description: Additional error details

    Payment:
      type: object
      properties:
        id:
          type: string
          description: Payment ID (pay_...)
        order_id:
          type: string
          description: Order ID (ord_...)
        buyer_profile_id:
          type: string
          description: Buyer profile ID (byp_...)
        buyer_clerk_user_id:
          type: string
          nullable: true
        amount_cents:
          type: integer
          description: Amount in cents
        currency:
          type: string
          default: ARS
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, refunded]
        method:
          type: string
          nullable: true
          description: Payment method (credit_card, debit_card, account_money, pix, bank_transfer)
        card_last4:
          type: string
          nullable: true
        gateway_reference:
          type: string
          nullable: true
          description: Mercado Pago payment ID
        items_summary:
          type: array
          nullable: true
          description: Per-seller breakdown for settlement calculation
          items:
            type: object
            properties:
              seller_profile_id:
                type: string
              subtotal_cents:
                type: integer
              shipping_cost_cents:
                type: integer
              order_seller_group_id:
                type: string
              buyer_profile_id:
                type: string
              buyer_clerk_user_id:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    product_id:
                      type: string
                    product_name_snapshot:
                      type: string
                    unit_price_cents:
                      type: integer
                    quantity:
                      type: integer
              shipping_address_snapshot:
                type: object
                nullable: true
              currency:
                type: string
        idempotency_key:
          type: string
          nullable: true
          description: Idempotency key for deduplication
        checkout_url:
          type: string
          nullable: true
          format: uri
          description: Mercado Pago checkout URL
        preference_id:
          type: string
          nullable: true
          description: Mercado Pago preference ID
        approved_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        payment_attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
      required: [id, order_id, buyer_profile_id, amount_cents, currency, status, created_at, updated_at]

    PaymentAttempt:
      type: object
      properties:
        id:
          type: string
        payment_id:
          type: string
        attempt_number:
          type: integer
        provider:
          type: string
          default: mercadopago
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PaymentCreateRequest:
      type: object
      properties:
        order_id:
          type: string
          description: Order ID
        buyer_clerk_user_id:
          type: string
          description: Buyer Clerk user ID
        buyer_profile_id:
          type: string
          description: Buyer profile ID
        buyer_email:
          type: string
          format: email
          description: Buyer email for MP payer
        amount_cents:
          type: integer
          description: Total amount in cents
        currency:
          type: string
          default: ARS
        items_summary:
          type: array
          description: Breakdown by seller
          items:
            type: object
            properties:
              seller_profile_id:
                type: string
              subtotal_cents:
                type: integer
              shipping_cost_cents:
                type: integer
              order_seller_group_id:
                type: string
              buyer_profile_id:
                type: string
              buyer_clerk_user_id:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    product_id:
                      type: string
                    product_name_snapshot:
                      type: string
                    unit_price_cents:
                      type: integer
                    quantity:
                      type: integer
              shipping_address_snapshot:
                type: object
                nullable: true
              currency:
                type: string
            required: [seller_profile_id, subtotal_cents, shipping_cost_cents]
        return_urls:
          type: object
          properties:
            success:
              type: string
              format: uri
            failure:
              type: string
              format: uri
            pending:
              type: string
              format: uri
      required: [order_id, buyer_clerk_user_id, buyer_profile_id, amount_cents]

    Refund:
      type: object
      properties:
        id:
          type: string
          description: Refund ID (ref_...)
        payment_id:
          type: string
        amount_cents:
          type: integer
        currency:
          type: string
          default: ARS
        status:
          type: string
          enum: [pending, approved, failed]
        reason:
          type: string
          description: Reason code (seller_rejected, buyer_cancelled, not_delivered, manual)
        gateway_reference:
          type: string
          nullable: true
          description: Mercado Pago refund ID
        seller_profile_id:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        payment:
          type: object
          nullable: true
          properties:
            order_id:
              type: string
            status:
              type: string
            amount_cents:
              type: integer
        status_history:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              from_status:
                type: string
                nullable: true
              to_status:
                type: string
              changed_by:
                type: string
                nullable: true
              reason:
                type: string
                nullable: true
              created_at:
                type: string
                format: date-time

    RefundCreateRequest:
      type: object
      properties:
        amount_cents:
          type: integer
          description: Refund amount in cents
        reason:
          type: string
          enum: [seller_rejected, buyer_cancelled, not_delivered, manual]
        seller_profile_id:
          type: string
          nullable: true
      required: [amount_cents, reason]

    Receipt:
      type: object
      properties:
        id:
          type: string
          description: Receipt ID (rec_...)
        payment_id:
          type: string
        receipt_number:
          type: string
        receipt_url:
          type: string
          format: uri
          description: PDF URL
        amount_cents:
          type: integer
        currency:
          type: string
        issued_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required: [id, payment_id, receipt_number, receipt_url, amount_cents, issued_at, created_at]

    ReceiptCreateRequest:
      type: object
      properties:
        payment_id:
          type: string
        receipt_number:
          type: string
        receipt_url:
          type: string
          format: uri
        amount_cents:
          type: integer
        issued_at:
          type: string
          format: date-time
      required: [payment_id, receipt_number, receipt_url, amount_cents, issued_at]

    Settlement:
      type: object
      properties:
        id:
          type: string
          description: Settlement ID (set_...)
        payment_id:
          type: string
        order_id:
          type: string
        order_seller_group_id:
          type: string
        seller_profile_id:
          type: string
        gross_amount_cents:
          type: integer
          description: Seller subtotal + shipping
        fee_amount_cents:
          type: integer
          description: Marketplace commission (10%)
        net_amount_cents:
          type: integer
          description: gross - fee
        currency:
          type: string
          default: ARS
        status:
          type: string
          enum: [pending, paid, failed, manual_review]
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
      required: [id, payment_id, order_id, order_seller_group_id, seller_profile_id, gross_amount_cents, fee_amount_cents, net_amount_cents, currency, status, created_at, updated_at]

    Payout:
      type: object
      properties:
        id:
          type: string
          description: Payout ID (pyt_...)
        settlement_id:
          type: string
        transfer_id:
          type: string
          nullable: true
          description: Mercado Pago transfer ID
        status:
          type: string
          enum: [pending, in_progress, completed, failed, manual_review]
        attempts:
          type: integer
        last_error:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settlement:
          type: object
          nullable: true
          properties:
            id:
              type: string
            order_id:
              type: string
            seller_profile_id:
              type: string
            gross_amount_cents:
              type: integer
            net_amount_cents:
              type: integer
            status:
              type: string
            payment:
              type: object
              properties:
                id:
                  type: string
                order_id:
                  type: string
                amount_cents:
                  type: integer
                status:
                  type: string
                created_at:
                  type: string
                  format: date-time
                buyer_profile_id:
                  type: string
      required: [id, settlement_id, status, attempts, created_at, updated_at]

    # Analytics / Metrics schemas
    PaymentMetrics:
      type: object
      properties:
        total_cents:
          type: integer
          description: Sum of amount_cents of all payments in the period
        count:
          type: integer
          description: Total number of payments
        approved_count:
          type: integer
          description: Number of approved payments
        avg_order_cents:
          type: integer
          description: Average order amount in cents
        success_rate:
          type: number
          format: float
          description: Approval rate percentage (0-100)

    RevenueByMethodItem:
      type: object
      properties:
        method:
          type: string
          description: Payment method (credit_card, debit_card, mercadopago, transfer, wallet)
        value:
          type: integer
          description: Total revenue in cents
        percentage:
          type: number
          format: float
          description: Percentage of total revenue

    TimeSeriesItem:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Bucket date (YYYY-MM-DD for daily, YYYY-MM for monthly)
        value:
          type: integer
          description: Aggregate value in cents

    RevenueBySellerItem:
      type: object
      properties:
        seller_profile_id:
          type: string
          description: Seller profile ID (slp_...)
        revenue_cents:
          type: integer
          description: Total revenue in cents for this seller

    SettlementMetrics:
      type: object
      properties:
        total_cents:
          type: integer
          description: Sum of gross_amount_cents
        fee_cents:
          type: integer
          description: Sum of fee_amount_cents
        net_cents:
          type: integer
          description: Sum of net_amount_cents (gross - fee)
        total_count:
          type: integer
          description: Total number of settlements
        pending_count:
          type: integer
        paid_count:
          type: integer
        failed_count:
          type: integer
        manual_review_count:
          type: integer
        avg_velocity_days:
          type: number
          format: float
          description: Average days from created_at to paid_at for paid settlements

    StatusBreakdownItem:
      type: object
      properties:
        status:
          type: string
          enum: [pending, paid, failed, manual_review]
        count:
          type: integer

    PendingBySellerItem:
      type: object
      properties:
        seller_profile_id:
          type: string
        pending_count:
          type: integer
        total_cents:
          type: integer
          description: Sum of gross_amount_cents for pending settlements

    RefundMetrics:
      type: object
      properties:
        total:
          type: integer
          description: Total number of refunds
        approved_count:
          type: integer
          description: Number of approved refunds
        total_amount_cents:
          type: integer
          description: Sum of amount_cents across all refunds
        by_reason:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
                enum: [seller_rejected, buyer_cancelled, not_delivered, manual]
              count:
                type: integer

    PayoutMetrics:
      type: object
      properties:
        count:
          type: integer
          description: Total number of payouts
        completed_count:
          type: integer
        failed_count:
          type: integer
        in_progress_count:
          type: integer
        pending_count:
          type: integer
        manual_review_count:
          type: integer

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication (JWT or service token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state transition or business logic conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: External service error (Mercado Pago or inter-app call)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
